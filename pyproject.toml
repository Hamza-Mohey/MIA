[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".venv",
    ".venv-training",
    "amicorpus",
    "datasets",
    "hf_cache",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "FURB", "SIM"]

[tool.ruff.lint.per-file-ignores]
# UI and subprocess boundaries must convert unexpected model failures into
# user-visible/serializable errors instead of terminating without context.
"app.py" = ["BLE001", "E402"]
"modules/model_worker.py" = ["BLE001"]
